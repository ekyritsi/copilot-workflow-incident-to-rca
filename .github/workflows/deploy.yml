name: Deploy demo app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check && npm test

      - name: Azure login
        uses: azure/login@v2
        with:
          # These are non-secret identifiers. OIDC avoids a stored client secret.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push container image
        env:
          REGISTRY_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          registry_login_server="$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)"
          docker build --tag "${registry_login_server}/incident-demo:${IMAGE_TAG}" .
          docker push "${registry_login_server}/incident-demo:${IMAGE_TAG}"

      - name: Deploy container revision
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          REGISTRY_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          registry_login_server="$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)"
          az containerapp registry set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --server "$registry_login_server" \
            --identity system \
            --output none
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "${registry_login_server}/incident-demo:${IMAGE_TAG}" \
            --set-env-vars DEMO_FAILURE_MODE=healthy \
            --output none

      - name: Smoke test
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 10 --retry-delay 5 "https://${fqdn}/health"
